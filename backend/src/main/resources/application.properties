spring.application.name=employee-management-system
server.port=8080

# MySQL connection. Create this database before starting the backend.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
s

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Change this value before deploying outside local development. Keep it at least 32 characters.
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-before-deploying-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.error.include-message=always
